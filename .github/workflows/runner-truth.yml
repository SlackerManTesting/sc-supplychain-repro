name: runner-truth
on:
  workflow_dispatch:
jobs:
  truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.3
      - name: Setup Node (their pattern node-version-file .nvmrc)
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm state BEFORE
        run: |
          echo "--- which -a npm:"; which -a npm || true
          echo "--- npm --version:"; npm --version
          echo "--- npm root -g:"; npm root -g
      - name: Update npm (their exact step)
        run: npm install -g npm@latest
      - name: npm state AFTER
        run: |
          echo "--- PATH=$PATH"
          echo "--- which -a npm:"; which -a npm || true
          echo "--- npm --version:"; npm --version
          echo "--- npm prefix -g:"; npm prefix -g 2>/dev/null || true
      - name: Lifecycle exec proof (benign)
        run: |
          npm install -g esbuild@0.25.5
          echo "--- esbuild installed at:"; which esbuild || true